name: Validate course data

on:
  push:
    paths: ["data/**", "notes/**", "scripts/validate.py", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "notes/**", "scripts/validate.py"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/validate.py
